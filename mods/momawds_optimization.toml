name = "Momawd's Optimization Mod"
summary = "All-in-one client FPS and world TPS optimizer with presets, XP clumping, and optional FPS/MSPT mini-HUD."
description = """
Sandboxed WebAssembly (`.hmod`) all-in-one **client FPS + world/server TPS** optimization mod built for **Horizon 26.3** (`api = "0.2"`, `side = "both"`).

## Client FPS & Frame-Time Optimizations
- **Dynamic Background, Minimized & Menu FPS Governor:** Automatically lowers framerate while the game window is unfocused (`5–60 FPS` configurable) and drops to `1 FPS` while minimized to cut background GPU power and heat. Caps idle menu FPS in Competitive (`120`) and Max FPS (`60`) profiles.
- **Distance Item-Frame 3D Content Culling:** Skips drawing expensive 3D item and map models inside distant item frames (`48m` / `32m` / `18m` by preset, tightening automatically under active `< 45 FPS` pressure) while keeping the item frame itself visible.
- **Adaptive Ambient Swirl & Crowd Name-Tag Relief:** Suppresses redundant ambient beacon swirls and crowd armor-stand name-tag overdraw under load without revealing hidden effects, hidden name tags, or hiding player name tags.

## World & Server TPS Optimizations *(Off by Default — Opt-In)*
> **Multiplayer Warning:** Both world/server simulation optimizations below (**Lossless XP Orb Clumping** and **Adaptive MSPT & Explosion Guard**) are **off by default** because they modify XP pickup/cooldown and server simulation behavior. Please check multiplayer server rules before enabling them.

- **Lossless `u128` XP Orb Clumping & Instant Pickup** *(default: Off)*: Merges nearby experience orbs of any denomination into exact saved-NBT `(i16 Value, i32 Count)` representations with zero lost XP points, collapses multi-count orbs on pickup, and clears XP pickup cooldowns.
- **Adaptive MSPT Wildlife Pacer & Chain-Explosion Guard** *(default: Off)*: Leaves healthy server ticks untouched; during MSPT spikes above your preset's threshold, deterministically phase-staggers ambient wildlife (`bat`, `cod`, `salmon`, `tropical_fish`, `tadpole`, `squid`, `glow_squid`) and caps redundant trailing entity blast-exposure walks on the 4th+ simultaneous explosion in a single tick.

## Settings & Mini-HUD
Configure live in **Options > Mods > Momawd's Optimization Mod > Config** (English & Polish):
- **Presets:** `Balanced` / `Competitive` / `Max FPS`
- **Mini-HUD:** `Off` / `Compact (FPS + MSPT)` / `Detailed (FPS + 1% Low + MSPT + Optimizations)` with selectable screen corner and automatic yield to `F3`.
"""
